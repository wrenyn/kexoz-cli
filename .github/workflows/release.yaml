name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ── Go CLI binaries (windows/linux/macos × amd64/arm64) ────────────────
  cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          exe=""
          if [ "${{ matrix.goos }}" = "windows" ]; then exe=".exe"; fi
          go build -ldflags "-X kexoz/cmd.Version=${{ github.ref_name }}" \
            -o "dist/kexoz-${{ matrix.goos }}-${{ matrix.goarch }}${exe}" .

      - name: Upload CLI Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kexoz-*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── CLI container image on GitHub Container Registry ───────────────────
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          # GHCR derives the namespace from the repository owner, which must be
          # lowercase.
          tags: |
            ghcr.io/${{ github.repository_owner }}/kexoz:latest
            ghcr.io/${{ github.repository_owner }}/kexoz:${{ github.ref_name }}

  # ── NPM Package Publish ───────────────────────────────────────────────
  npm:
    needs: cli
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip when no npm token is configured
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not set, so the npm package was not published."

      - name: Checkout Code
        if: env.NPM_TOKEN != ''
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Bump npm package version to match release tag
        if: env.NPM_TOKEN != ''
        working-directory: packages/npm
        run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      - name: Publish to NPM
        if: env.NPM_TOKEN != ''
        working-directory: packages/npm
        run: |
          npm ci
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          KEXOZ_SKIP_DOWNLOAD: 1

  # ── Smoke Test ────────────────────────────────────────────────────────
  smoke-test:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - name: Download CLI asset
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: wrenyn/kexoz-cli
          version: tags/${{ github.ref_name }}
          file: kexoz-linux-amd64
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Version
        run: |
          chmod +x kexoz-linux-amd64
          ./kexoz-linux-amd64 --version

  # ── Asset verification ────────────────────────────────────────────────
  # The website installers, npm/Chocolatey/Homebrew wrappers and the docs all
  # fetch these exact asset names, so a partial release must fail loudly instead
  # of silently leaving dead download links behind.
  verify-assets:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every documented CLI asset is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          status=0
          for name in \
            kexoz-windows-amd64.exe kexoz-windows-arm64.exe \
            kexoz-linux-amd64 kexoz-linux-arm64 \
            kexoz-darwin-amd64 kexoz-darwin-arm64; do
            if ! grep -qx "$name" <<< "$assets"; then
              echo "::error::missing release asset: $name"
              status=1
            fi
          done
          exit $status
